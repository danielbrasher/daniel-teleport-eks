apiVersion: resources.teleport.dev/v1
kind: TeleportRoleV8
metadata:
  name: okta-approver
  namespace: teleport
spec:
  allow:
    review_requests:
      roles:
        - okta-kube-access
        # - okta-ssh-access # autoapproved
        - okta-ssh-root
        - okta-prod-ssh-access
      preview_as_roles:
        - okta-prod-ssh-access
  options:
    max_session_ttl: 12h