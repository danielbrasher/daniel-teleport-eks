apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: teleport
resources:
  # Order in this list does not control apply order -- the operator reconciles
  # each CR independently and retries. It is grouped for humans.
  - tokens/aws-discovery-iam-token.yaml
  - roles/okta-base-requester.yaml
  - roles/okta-kube-access.yaml
  - roles/okta-ssh-access.yaml
  - roles/okta-ssh-root.yaml
  - connectors/okta.yaml
  - access-monitoring-rules/auto-approve-okta-ssh-access.yaml

labels:
  - includeSelectors: false
    pairs:
      app.kubernetes.io/part-of: teleport
      teleport.dev/managed-by: flux
