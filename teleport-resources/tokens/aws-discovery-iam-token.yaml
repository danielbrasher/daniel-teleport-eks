# referenced twice in the kube-agent values:
# 1. joinParams.tokenName (the agent itself)
# 2. discovery_service.aws[].install.join_params.token_name (nodes SSM installs)
# required for kube-agent to join, enforced by Flux dependsOn
# (ensures teleport-resources are present before teleport-agents)

# more tightly scoped than an IAM join token with only aws_account set, which would let ANY principal in the account register as a Node
apiVersion: resources.teleport.dev/v2
kind: TeleportProvisionToken
metadata:
  name: aws-discovery-iam-token
  namespace: teleport
spec:
  # Teleport verifies joiner's sts:GetCallerIdentity result against allow rules
  join_method: iam
  roles:
    - Discovery # joins with this token via IRSA (assumed-role/daniel-teleport-discovery)
    - Node # joins with this token via instance profile
  allow:
    # Discovery Service pod (IRSA)
    - aws_account: ${AWS_ACCOUNT_ID_QUOTED}
      aws_arn: "arn:aws:sts::${AWS_ACCOUNT_ID}:assumed-role/daniel-teleport-discovery/*"
    # discovered EC2 instances
    - aws_account: ${AWS_ACCOUNT_ID_QUOTED}
      aws_arn: "arn:aws:sts::${AWS_ACCOUNT_ID}:assumed-role/${TELEPORT_EC2_NODE_ROLE}/*"
