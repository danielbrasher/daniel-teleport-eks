# Grafana admin credentials pulled from Secrets Manager
# both keys projected, read by chart and dashboard sidecar
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-admin
  namespace: monitoring
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: grafana-admin
    creationPolicy: Owner
  data:
    - secretKey: admin-user
      remoteRef:
        key: ${SECRET_PREFIX}/grafana-admin
        property: admin-user
    - secretKey: admin-password
      remoteRef:
        key: ${SECRET_PREFIX}/grafana-admin
        property: admin-password
