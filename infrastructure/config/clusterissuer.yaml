apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-production
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: ${ACME_EMAIL}
    privateKeySecretRef:
      name: letsencrypt-production-account-key # TODO
    solvers:
      - dns01:
          route53:
            region: ${AWS_REGION}
        selector:
          dnsZones:
            - dbteleport.com
