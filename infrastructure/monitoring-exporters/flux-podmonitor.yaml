# Flux controller metrics (reconcile success/failure, duration, etc.) for Kustomizations and HelmReleases
# useful to be able to correlate Flux activity with other cluster metrics
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: flux-system
  labels:
    release: kube-prometheus-stack
spec:
  namespaceSelector:
    matchNames:
      - flux-system
  selector:
    matchLabels:
      app.kubernetes.io/part-of: flux
  podMetricsEndpoints:
    - port: http-prom
      interval: 30s