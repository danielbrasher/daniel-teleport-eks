# External availability probe targeting the public proxy address
# needed bc all other currently reported metrics are from inside the cluster...
# ...but cluster may still be unreachable from the outside (misconfigured loadbalancer, expired public cert, misconfigured DNS, etc.)
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: blackbox-exporter
  namespace: monitoring
spec:
  interval: 1h
  releaseName: blackbox-exporter
  timeout: 10m
  chart:
    spec:
      chart: prometheus-blackbox-exporter
      version: "11.x"
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: flux-system
  install:
    remediation:
      retries: 2
  upgrade:
    remediation:
      retries: 2
      strategy: rollback
  driftDetection:
    mode: enabled

  values:
    # pinned so the Probe can address the service by a static name
    fullnameOverride: blackbox-exporter

    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        memory: 128Mi
---
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: teleport-proxy
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  interval: 60s
  module: http_2xx
  prober:
    url: blackbox-exporter:9115
  targets:
    staticConfig:
      static:
        - https://${TELEPORT_CLUSTER_NAME}
