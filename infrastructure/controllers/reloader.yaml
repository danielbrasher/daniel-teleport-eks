# watch client cert Secret, trigger rolling restart
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: reloader
  namespace: flux-system
spec:
  interval: 1h
  chart:
    spec:
      chart: reloader
      version: "2.2.17"
      sourceRef:
        kind: HelmRepository
        name: stakater
        namespace: flux-system
  targetNamespace: teleport
  install:
    createNamespace: false
  values:
    reloader:
      watchGlobally: false
      reloadStrategy: annotations
