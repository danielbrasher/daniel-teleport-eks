# distributes CA bundles into namespaces (needed bc client and server CA are separate and each needs the other side's root)
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: trust-manager
  namespace: cert-manager
spec:
  interval: 1h
  dependsOn:
    - name: cert-manager
      namespace: cert-manager
  chart:
    spec:
      chart: trust-manager
      version: "1.21"
      sourceRef:
        kind: HelmRepository
        name: jetstack
        namespace: flux-system
  install:
    crds: Create
  upgrade:
    crds: CreateReplace
  values:
    app:
      trust:
        namespace: cert-manager # ns that trust-manager reads Bundle sources from (where both CA keypairs live)
