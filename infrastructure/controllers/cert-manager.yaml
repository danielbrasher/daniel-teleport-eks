apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager
  namespace: cert-manager
spec:
  interval: 1h
  chart:
    spec:
      chart: cert-manager
      version: "1.21.1"
      sourceRef:
        kind: HelmRepository
        name: jetstack
        namespace: flux-system
  install:
    crds: Create
  upgrade:
    crds: CreateReplace
  values:
    crds:
      enabled: true
    # for solving DNS-01 via Route53 with IRSA (terraform/iam-irsa.tf)
    serviceAccount:
      create: true
      name: cert-manager
      annotations:
        eks.amazonaws.com/role-arn: ${CERT_MANAGER_ROLE_ARN}
    securityContext:
      # IRSA projects web identity token as root:1001 0440
      # without specifying 'fsGroup' below, controller runs as a different group, can't read the token, and Route53 solver fails with AccessDenied at challenge and certs never issue
      fsGroup: 1001
