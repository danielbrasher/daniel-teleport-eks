apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager
  namespace: cert-manager
spec:
  interval: 1h
  chart:
    spec:
      chart: cert-manager
      version: "1.21.1"
      sourceRef:
        kind: HelmRepository
        name: jetstack
        namespace: flux-system
  install:
    crds: Create
  upgrade:
    crds: CreateReplace
  values:
    crds:
      enabled: true
    # for solving DNS-01 via Route53 with IRSA # TODO
    serviceAccount:
      annotations:
        eks.amazonaws.com/role-arn: ${CERT_MANAGER_ROLE_ARN:=} # TODO
