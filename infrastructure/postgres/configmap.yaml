apiVersion: v1
kind: ConfigMap
metadata:
  name: teleport-postgres-config
  namespace: teleport-databases
data:
  postgresql.conf: |
    data_directory = '/var/lib/postgresql/data/pgdata'
    hba_file       = '/etc/postgresql/pg_hba.conf'
    listen_addresses = '*'
    port = 5432

    ssl = on
    ssl_cert_file = '/etc/postgres-tls/tls.crt'
    ssl_key_file  = '/etc/postgres-tls/tls.key'
    ssl_ca_file   = '/etc/postgres-tls/db-client.cas'
    ssl_min_protocol_version = 'TLSv1.2'

    max_connections = 200

    wal_level = logical
    max_wal_senders = 10
    max_replication_slots = 10

    log_min_duration_statement = 1000
    log_connections = on
    log_disconnections = on

  pg_hba.conf: |
    # Local socket only, for maintenance via `kubectl exec`. Not reachable over
    # the network.
    local     all   postgres                trust

    # Teleport, client-cert auth - only admits a cert with CN=teleport, signed by a CA in db-client.cas
    hostssl   teleport_backend   teleport   0.0.0.0/0   cert
    hostssl   teleport_backend   teleport   ::/0        cert
    hostssl   teleport_audit     teleport   0.0.0.0/0   cert
    hostssl   teleport_audit     teleport   ::/0        cert

    # postgres_exporter scoped to teleport_backend only
    hostssl   teleport_backend   postgres_exporter   0.0.0.0/0   cert
    hostssl   teleport_backend   postgres_exporter   ::/0        cert

    # Anything not matched above is rejected
    # no 'host' (non-TLS) rule, so plaintext TCP can't authenticate at all