# CA that signs the Postgres server cert for Teleport
apiVersion: trust.cert-manager.io/v1alpha1
kind: Bundle
metadata:
  name: teleport-postgres-server-ca
spec:
  sources:
    - secret:
        name: postgres-ca-key-pair
        key: tls.crt
  target:
    configMap:
      key: ca.crt
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: In
          values:
            - teleport
            - monitoring # here so postgres_exporter can verify the Postgres server cert