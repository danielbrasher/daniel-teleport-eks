# polls for out-of-band IAM/Secrets Manager changes and open an issue on drift
name: terraform-drift

on:
  schedule:
    - cron: '0 9 * * *' # run at 9 AM every day of the week
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  issues: write

env:
  AWS_REGION: us-west-1
  TF_IN_AUTOMATION: "true"
  TF_VAR_region: ${{ vars.AWS_REGION }}
  TF_VAR_name_prefix: ${{ vars.NAME_PREFIX }}
  TF_VAR_eks_cluster_name: ${{ vars.EKS_CLUSTER_NAME }}
  TF_VAR_teleport_namespace: ${{ vars.TELEPORT_NAMESPACE }}
  TF_VAR_teleport_cluster_name: ${{ vars.TELEPORT_CLUSTER_NAME }}
  TF_VAR_session_recording_bucket: ${{ vars.SESSION_RECORDING_BUCKET }}
  TF_VAR_ssm_document_name: ${{ vars.SSM_DOCUMENT_NAME }}
  TF_VAR_discoverable_tag: ${{ vars.DISCOVERABLE_TAG }}
  TF_VAR_dns_zone_name: ${{ vars.DNS_ZONE_NAME }}
  TF_VAR_github_repo: ${{ vars.TF_VAR_GITHUB_REPO }} # ${{ vars.GITHUB_REPO }}
  TF_VAR_tags: ${{ vars.TAGS }}

jobs:
  detect:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v7
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: hashicorp/setup-terraform@v3
      - run: terraform init
      - id: plan
        run: |
          set +e
          terraform plan -detailed-exitcode -no-color -input=false
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" -eq 1 ]; then exit 1; fi
      - if: steps.plan.outputs.code == '2'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'Terraform drift detected in the Teleport AWS layer',
              body: 'A scheduled `terraform plan` is non-empty. Someone changed IAM or Secrets Manager outside of Git.',
              labels: ['drift'],
            });
