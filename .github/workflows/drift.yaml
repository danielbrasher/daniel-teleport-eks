# polls for out-of-band IAM/Secrets Manager changes and open an issue on drift
name: terraform-drift

on:
  schedule:
    - cron: '0 9 * * 1-7' # run at 9 AM every day of the week
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  issues: write

jobs:
  detect:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v7
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-west-1
      - uses: hashicorp/setup-terraform@v3
      - run: terraform init
      - id: plan
        run: terraform plan -detailed-exitcode -no-color -input=false || echo "code=$?" >> "$GITHUB_OUTPUT"
      - if: steps.plan.outputs.code == '2'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'Terraform drift detected in the Teleport AWS layer',
              body: 'A scheduled `terraform plan` is non-empty. Someone changed IAM or Secrets Manager outside of Git.',
              labels: ['drift'],
            });
