# IAM, IRSA trust policies, KMS, Secrets Manager container, SSM document
name: terraform

on:
  pull_request:
    branches: [main]
    paths: ['terraform/**', '.github/workflows/terraform.yaml']
  push:
    branches: [main]
    paths: ['terraform/**']

permissions:
  contents: read
  id-token: write        # OIDC -> AWS
  pull-requests: write   # to post the plan

concurrency:
  group: terraform-dev
  cancel-in-progress: false

env:
  AWS_REGION: us-west-1
  TF_IN_AUTOMATION: "true"

jobs:
  plan:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v7

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.15.8

      - run: terraform fmt -check -recursive
      - run: terraform init
      - run: terraform validate

      - name: plan
        id: plan
        run: |
          terraform plan -no-color -input=false -out=tfplan | tee plan.txt
          echo "exitcode=$?" >> "$GITHUB_OUTPUT"

      - name: comment plan
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('terraform/plan.txt', 'utf8');
            const body = ['#### Terraform plan', '```terraform',
                          plan.length > 60000 ? plan.slice(-60000) : plan, '```'].join('\n');
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });

      - uses: actions/upload-artifact@v7
        with:
          name: tfplan
          path: terraform/tfplan

  apply:
    needs: plan
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    # Require a human click before IAM changes land
    environment: dev-aws
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v7
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.15.8
      - uses: actions/download-artifact@v8
        with:
          name: tfplan
          path: terraform
      - run: terraform init
      - run: terraform apply -input=false -auto-approve tfplan
