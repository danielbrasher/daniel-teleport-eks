# Kubernetes RBAC for kubernetes_groups specified in the okta-kube-access role
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: k8s-rbac
  namespace: flux-system
spec:
  interval: 30m
  retryInterval: 1m
  timeout: 5m
  path: ./k8s-rbac
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
