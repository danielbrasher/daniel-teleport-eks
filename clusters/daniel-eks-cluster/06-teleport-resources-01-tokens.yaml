# Provision token
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: teleport-resources-tokens
  namespace: flux-system
spec:
  dependsOn:
    - name: teleport-cluster
  interval: 10m
  retryInterval: 1m
  timeout: 5m
  path: ./teleport-resources/tokens
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-vars
  healthChecks:
    - apiVersion: resources.teleport.dev/v2
      kind: TeleportProvisionToken
      name: aws-discovery-iam-token
      namespace: teleport