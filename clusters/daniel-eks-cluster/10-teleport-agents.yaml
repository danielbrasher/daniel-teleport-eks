# Discovery Service agent
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: teleport-agents
  namespace: flux-system
spec:
  dependsOn:
    - name: teleport-resources-roles # last in the 'teleport-resources' dependency chain - the real fine-grained dependency is 'teleport-resources-tokens'
  interval: 30m
  retryInterval: 2m
  timeout: 10m
  path: ./apps/teleport-agents
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-vars
