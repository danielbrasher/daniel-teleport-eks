# Roles
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: teleport-resources-roles
  namespace: flux-system
spec:
  dependsOn:
    - name: teleport-resources-access-monitoring-rules
  interval: 10m
  retryInterval: 1m
  timeout: 5m
  path: ./teleport-resources/roles
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-vars
  healthChecks: # non-exhaustive
    - apiVersion: resources.teleport.dev/v1
      kind: TeleportRoleV8
      name: okta-base-requester
      namespace: teleport
