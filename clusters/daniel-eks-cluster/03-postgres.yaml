apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: postgres
  namespace: flux-system
spec:
  dependsOn:
    - name: infra-pki
  interval: 30m
  retryInterval: 1m
  timeout: 10m
  path: ./infrastructure/postgres
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
