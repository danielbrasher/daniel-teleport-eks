# postgres_exporter + blackbox_exporter
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: monitoring-exporters
  namespace: flux-system
spec:
  dependsOn:
    - name: monitoring
    - name: infra-pki
    - name: postgres
  interval: 30m
  retryInterval: 2m
  timeout: 10m
  path: ./infrastructure/monitoring-exporters
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-vars
