# Okta connector
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: teleport-resources-connectors
  namespace: flux-system
spec:
  dependsOn:
    - name: teleport-resources-tokens
  interval: 10m
  retryInterval: 1m
  timeout: 5m
  path: ./teleport-resources/connectors
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-vars
  healthChecks:
    - apiVersion: resources.teleport.dev/v2
      kind: TeleportSAMLConnector
      name: okta
      namespace: teleport
