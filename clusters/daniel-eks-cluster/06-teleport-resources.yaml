# Roles, Okta connector, access monitoring rules, provision token
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: teleport-resources
  namespace: flux-system
spec:
  dependsOn:
    - name: teleport-cluster
  interval: 10m
  retryInterval: 1m
  timeout: 5m
  path: ./teleport-resources
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-vars
  healthChecks:
    - apiVersion: resources.teleport.dev/v1
      kind: TeleportRoleV8
      name: okta-base-requester
      namespace: teleport
