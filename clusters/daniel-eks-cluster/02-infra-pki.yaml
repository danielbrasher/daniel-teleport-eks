# Postgres PKI + Teleport's client certificate.
#
# Separate from infra-config because it must be Ready before the auth pods
# start, and because the healthChecks below are the whole point: `wait: true`
# plus a Certificate health check means Flux blocks teleport-cluster until
# cert-manager has actually issued the client cert. No CrashLoop while the
# Secret does not exist yet.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infra-pki
  namespace: flux-system
spec:
  dependsOn:
    - name: infra-controllers
  interval: 30m
  retryInterval: 1m
  timeout: 10m
  path: ./infrastructure/pki
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  healthChecks:
    - apiVersion: cert-manager.io/v1
      kind: Certificate
      name: teleport-backend-client
      namespace: teleport
    - apiVersion: cert-manager.io/v1
      kind: Certificate
      name: teleport-postgres-server
      namespace: teleport-databases
