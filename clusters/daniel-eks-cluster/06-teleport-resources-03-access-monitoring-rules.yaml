# Access monitoring rules
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: teleport-resources-access-monitoring-rules
  namespace: flux-system
spec:
  dependsOn:
    - name: teleport-resources-connectors
  interval: 10m
  retryInterval: 1m
  timeout: 5m
  path: ./teleport-resources/access-monitoring-rules
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-vars
  healthChecks:
    - apiVersion: resources.teleport.dev/v1
      kind: TeleportAccessMonitoringRuleV1
      name: auto-approve-okta-ssh-access
      namespace: teleport
