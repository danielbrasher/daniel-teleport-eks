# Flux commit status notifications when a merge fails to reconcile
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: notifications
  namespace: flux-system
spec:
  dependsOn:
    - name: infra-config # ClusterSecretStore the ExternalSecret reads through
  interval: 30m
  retryInterval: 2m
  timeout: 5m
  path: ./infrastructure/notifications
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-vars
