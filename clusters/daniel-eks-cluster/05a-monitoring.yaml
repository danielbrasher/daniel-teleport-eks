# Prometheus Operator CRDs + Prometheus + Grafana
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: monitoring
  namespace: flux-system
spec:
  dependsOn:
    - name: infra-config
  interval: 30m
  retryInterval: 2m
  timeout: 20m # accommodating slow first install (Prometheus and Grafana PVCs bind on WaitForFirstConsumer)
  path: ./infrastructure/monitoring
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-vars
