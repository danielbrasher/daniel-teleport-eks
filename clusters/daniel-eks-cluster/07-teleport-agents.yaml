# Discovery Service agent
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: teleport-agents
  namespace: flux-system
spec:
  dependsOn:
    - name: teleport-resources # bc aws-discovery-iam-token must exist in Teleport for the agent to authenticate to the Auth Service
  interval: 30m
  retryInterval: 2m
  timeout: 10m
  path: ./apps/teleport-agents
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-vars
